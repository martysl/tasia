cmd = "./tasia"
args = ["acp"]

[agent_servers.tasia.targets.linux-x86_64]
archive = "https://github.com/anomalyco/opencode/releases/download/v1.1.47/opencode-linux-x64.tar.gz"
cmd = "./tasia"
args = ["acp"]

[agent_servers.tasia.targets.windows-x86_64]
